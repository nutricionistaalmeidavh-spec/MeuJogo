name: Build and WebKit QA
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Unit tests — terrain, economy, welds, blueprints
        run: npm test
      - name: Production TypeScript and Vite build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: meujogo-dist
          path: dist/
  webkit:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Launch Vite test server
        run: npm run dev -- --host 127.0.0.1 > /tmp/meujogo-vite.log 2>&1 & echo $! > /tmp/meujogo.pid
      - name: Real browser tests — iPhone and desktop WebKit
        run: node tests/smoke-webkit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-phase-1-2
          path: webkit-*.png
          if-no-files-found: ignore
